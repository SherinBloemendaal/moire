<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Two sets of rings, slightly apart: where they cross, the moiré pattern appears. -->
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="0.55" stop-color="#14123A"/>
      <stop offset="1" stop-color="#0A0A1F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#7C5CFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shine" cx="0.3" cy="0.12" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="lensFade" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <circle cx="512" cy="512" r="360" fill="url(#fade)"/>
    </mask>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="12" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <g clip-path="url(#squircle)">
      <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
      <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
      <g mask="url(#lensFade)">
      <g fill="none" stroke="#22D3EE" stroke-width="7" stroke-opacity="0.95">
      <circle cx="437" cy="512" r="17.0"/>
      <circle cx="437" cy="512" r="34.0"/>
      <circle cx="437" cy="512" r="51.0"/>
      <circle cx="437" cy="512" r="68.0"/>
      <circle cx="437" cy="512" r="85.0"/>
      <circle cx="437" cy="512" r="102.0"/>
      <circle cx="437" cy="512" r="119.0"/>
      <circle cx="437" cy="512" r="136.0"/>
      <circle cx="437" cy="512" r="153.0"/>
      <circle cx="437" cy="512" r="170.0"/>
      <circle cx="437" cy="512" r="187.0"/>
      <circle cx="437" cy="512" r="204.0"/>
      <circle cx="437" cy="512" r="221.0"/>
      <circle cx="437" cy="512" r="238.0"/>
      <circle cx="437" cy="512" r="255.0"/>
      <circle cx="437" cy="512" r="272.0"/>
      <circle cx="437" cy="512" r="289.0"/>
      <circle cx="437" cy="512" r="306.0"/>
      <circle cx="437" cy="512" r="323.0"/>
      <circle cx="437" cy="512" r="340.0"/>
      </g>
      <g fill="none" stroke="#C084FC" stroke-width="7" stroke-opacity="0.9">
      <circle cx="587" cy="512" r="17.0"/>
      <circle cx="587" cy="512" r="34.0"/>
      <circle cx="587" cy="512" r="51.0"/>
      <circle cx="587" cy="512" r="68.0"/>
      <circle cx="587" cy="512" r="85.0"/>
      <circle cx="587" cy="512" r="102.0"/>
      <circle cx="587" cy="512" r="119.0"/>
      <circle cx="587" cy="512" r="136.0"/>
      <circle cx="587" cy="512" r="153.0"/>
      <circle cx="587" cy="512" r="170.0"/>
      <circle cx="587" cy="512" r="187.0"/>
      <circle cx="587" cy="512" r="204.0"/>
      <circle cx="587" cy="512" r="221.0"/>
      <circle cx="587" cy="512" r="238.0"/>
      <circle cx="587" cy="512" r="255.0"/>
      <circle cx="587" cy="512" r="272.0"/>
      <circle cx="587" cy="512" r="289.0"/>
      <circle cx="587" cy="512" r="306.0"/>
      <circle cx="587" cy="512" r="323.0"/>
      <circle cx="587" cy="512" r="340.0"/>
      </g>
      </g>
      <rect x="100" y="100" width="824" height="824" fill="url(#shine)"/>
    </g>
    <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3"/>
  </g>
</svg>
