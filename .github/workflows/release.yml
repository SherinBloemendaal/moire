name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The release notes in the update window come from the commits since the last tag.
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test
        run: swift test

      - name: Build app (Apple Silicon and Intel)
        env:
          UNIVERSAL: "1"
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}" ./build-app.sh
          lipo -archs build/Moire.app/Contents/MacOS/Moire

      - name: Build DMG
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/make-dmg.sh

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/Moire.app dist/Moire.zip
          cp build/Moire.dmg dist/Moire.dmg
          cd dist
          shasum -a 256 Moire.dmg Moire.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes for the update window
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          range="${previous:+$previous..}${GITHUB_REF_NAME}"
          # User-facing changes only, without the "type(scope): " prefix.
          git log --no-merges --format=%s "$range" \
            | grep -E '^(feat|fix|perf)(\([^)]*\))?!?: ' \
            | sed -E 's/^[a-z]+(\([^)]*\))?!?: //' > dist/notes.txt || true
          cat dist/notes.txt

      - name: Update feed
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::The SPARKLE_ED_PRIVATE_KEY secret is missing, so the update cannot be signed."
            exit 1
          fi
          scripts/make-appcast.sh "${GITHUB_REF_NAME#v}" dist/Moire.zip dist/appcast.xml dist/notes.txt
          cat dist/appcast.xml

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
          generate_release_notes: true
          files: |
            dist/Moire.dmg
            dist/Moire.zip
            dist/SHA256SUMS
            dist/appcast.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
