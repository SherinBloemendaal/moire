name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test
        run: swift test

      - name: Build app (Apple Silicon and Intel)
        env:
          UNIVERSAL: "1"
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}" ./build-app.sh
          lipo -archs build/Moire.app/Contents/MacOS/Moire

      - name: Build DMG
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/make-dmg.sh

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/Moire.app dist/Moire.zip
          cp build/Moire.dmg dist/Moire.dmg
          cd dist
          shasum -a 256 Moire.dmg Moire.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
          generate_release_notes: true
          files: |
            dist/Moire.dmg
            dist/Moire.zip
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
