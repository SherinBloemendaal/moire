name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Swift version
        run: swift --version

      - name: Test
        run: swift test

      - name: Build app (Apple Silicon and Intel)
        run: UNIVERSAL=1 ./build-app.sh

      - name: Build DMG
        run: scripts/make-dmg.sh

  benchmark:
    name: Benchmark (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The commit this one is compared with: the pull request's base, or main before this push.
      - name: Pick the base commit
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${PR_BASE:-$BEFORE}"
          if ! git cat-file -e "$base^{commit}" 2>/dev/null || [ "$base" = "$(git rev-parse HEAD)" ]; then
            base="$(git rev-parse HEAD^)"
          fi
          echo "Comparing $(git rev-parse --short HEAD) with $(git rev-parse --short "$base")"
          git worktree add --detach ../base "$base"

      - name: Build
        run: |
          swift build -c release --product moire-bench
          swift build -c release --product moire-bench --package-path ../base

      # A fixed baseline from another runner does not work: GitHub's runners differ in speed by
      # 1.5 to 2 times between runs. Both commits are timed on this runner instead, in turns, so a
      # slow runner or a slow stretch slows both. Each keeps its fastest run, and only a slowdown of
      # more than 50% in a scenario of 0.5 s or more fails the build.
      - name: Run
        run: |
          set -euo pipefail
          for round in 1 2 3; do
            ../base/.build/release/moire-bench run --files 20000 --large --only engine --root "$RUNNER_TEMP/bench-base" --json "base-$round.json"
            .build/release/moire-bench run --files 20000 --large --only engine --root "$RUNNER_TEMP/bench-head" --json "head-$round.json"
          done
          .build/release/moire-bench compare --max-regression 0.5 \
            --base base-1.json --base base-2.json --base base-3.json \
            --head head-1.json --head head-2.json --head head-3.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: "*-?.json"

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck
        run: shellcheck install.sh build-app.sh scripts/*.sh
